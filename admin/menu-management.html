<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu Management — Aurum Kitchen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="page-veil" aria-hidden="true"></div>

  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar">
      <a class="admin-brand" href="dashboard.html">
        <span class="nav__mark">A</span>
        <span class="admin-brand__text"><strong>Aurum</strong><em>Admin</em></span>
      </a>
      <nav class="admin-nav" aria-label="Admin">
        <a href="dashboard.html" class="admin-nav__link" data-admin-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg><span>Dashboard</span></a>
        <a href="bookings.html" class="admin-nav__link" data-admin-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Bookings</span><span class="admin-nav__count" id="navPendingCount"></span></a>
        <a href="menu-management.html" class="admin-nav__link" data-admin-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"/><path d="M12 3v18"/><circle cx="12" cy="11" r="9"/></svg><span>Menu</span></a>
        <a href="availability.html" class="admin-nav__link" data-admin-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg><span>Availability</span></a>
      </nav>
      <div class="admin-sidebar__foot">
        <a href="../index.html" class="admin-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to customer site</a>
      </div>
    </aside>

    <header class="admin-topbar">
      <button class="admin-topbar__toggle" id="adminNavToggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span></button>
      <div class="admin-topbar__title">
        <span class="eyebrow">Manage</span>
        <h1>Menu</h1>
      </div>
      <div class="admin-topbar__meta">
        <span class="admin-topbar__clock" id="adminClock"></span>
        <span class="admin-avatar">K</span>
      </div>
    </header>

    <main class="admin-main" id="adminMenu">
      <section class="admin-toolbar">
        <div class="admin-filters" id="menuCatFilters">
          <button class="chip is-active" data-cat="all">All</button>
        </div>
        <div class="admin-toolbar__actions">
          <button class="btn btn--primary btn--sm magnetic" id="addDishBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
            <span>New dish</span>
          </button>
        </div>
      </section>

      <section class="menu-admin-grid" id="menuAdminGrid"></section>

      <div class="empty-state" id="menuEmpty" hidden>
        <div class="empty-state__icon">○</div>
        <h3>No dishes yet</h3>
        <p>Add your first dish to get started.</p>
        <button class="btn btn--primary btn--sm" id="emptyAddBtn">Add a dish</button>
      </div>
    </main>

    <!-- ADD / EDIT DIALOG -->
    <dialog class="modal" id="dishModal" aria-labelledby="dishModalTitle">
      <form class="modal__form" id="dishForm" method="dialog" novalidate>
        <header class="modal__head">
          <h2 id="dishModalTitle">New dish</h2>
          <button type="button" class="modal__close" id="dishModalClose" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>

        <div class="modal__body">
          <input type="hidden" id="dishId" />

          <div class="field">
            <label class="field__label" for="dishName">Name</label>
            <input class="field__control" id="dishName" type="text" required maxlength="80" placeholder="e.g. Saffron Tomato Soup" />
            <span class="field__error" data-err="dishName"></span>
          </div>

          <div class="field">
            <label class="field__label" for="dishDescription">Description</label>
            <textarea class="field__control" id="dishDescription" rows="3" maxlength="240" placeholder="Short, appetising description"></textarea>
          </div>

          <div class="modal__row">
            <div class="field">
              <label class="field__label" for="dishCategory">Category</label>
              <input class="field__control" id="dishCategory" type="text" list="categoryList" required placeholder="Starters" />
              <datalist id="categoryList"></datalist>
              <span class="field__error" data-err="dishCategory"></span>
            </div>
            <div class="field">
              <label class="field__label" for="dishPrice">Price (₹)</label>
              <input class="field__control" id="dishPrice" type="number" min="1" max="99999" step="1" required placeholder="380" />
              <span class="field__error" data-err="dishPrice"></span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="dishImage">Image URL</label>
            <input class="field__control" id="dishImage" type="url" placeholder="https://images.unsplash.com/..." />
            <span class="field__hint">Any image URL works. Leave blank for a placeholder.</span>
          </div>

          <div class="modal__checks">
            <label class="check">
              <input type="checkbox" id="dishAvailable" checked />
              <span>Available to order</span>
            </label>
            <label class="check">
              <input type="checkbox" id="dishFeatured" />
              <span>Feature on homepage</span>
            </label>
          </div>

          <span class="field__error" data-err="general"></span>
        </div>

        <footer class="modal__foot">
          <button type="button" class="btn btn--ghost btn--sm" id="dishCancel">Cancel</button>
          <button type="submit" class="btn btn--primary btn--sm" id="dishSave">Save dish</button>
        </footer>
      </form>
    </dialog>

    <footer class="admin-footer">
      <span>© <span id="adminYear"></span> Aurum Kitchen · Admin panel</span>
      <span>Frontend demo · Data in <code>localStorage</code></span>
    </footer>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/customer.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
