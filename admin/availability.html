<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availability — Provider Console</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="sidebar">
      <div class="admin-brand">
        <div class="admin-brand-mark">F</div>
        <div class="admin-brand-text">Food Management<small>Provider Console</small></div>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-label">Overview</div>
        <a href="dashboard.html">◈ Dashboard</a>
        <a href="bookings.html">◈ Bookings</a>
        <div class="admin-nav-label">Management</div>
        <a href="menu-management.html">◈ Menu</a>
        <a href="availability.html" class="active">◈ Availability</a>
      </nav>
      <div class="admin-sidebar-footer">
        Demo Provider Access<br />
        <a href="../index.html">← Back to Storefront</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:var(--s-3);">
          <button class="admin-toggle" id="sidebarToggle">☰</button>
          <div>
            <h1>Availability</h1>
            <div class="admin-topbar-sub">Control what's bookable in real time</div>
          </div>
        </div>
        <div class="admin-topbar-actions">
          <button class="btn btn-ghost btn-sm" id="markAllAvailable">Mark all available</button>
        </div>
      </header>

      <main class="admin-content">
        <section class="panel reveal">
          <div class="panel-header">
            <h2>Dishes</h2>
            <span class="text-muted" id="availSummary" style="font-size:0.85rem;"></span>
          </div>
          <div class="panel-body no-pad">
            <div class="booking-table-wrap" id="availabilityTableWrap"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Admin.initShell();
      Admin.renderAvailability();
    });
  </script>
</body>
</html>
