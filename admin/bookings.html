<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — Provider Console</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="sidebar">
      <div class="admin-brand">
        <div class="admin-brand-mark">F</div>
        <div class="admin-brand-text">Food Management<small>Provider Console</small></div>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-label">Overview</div>
        <a href="dashboard.html">◈ Dashboard</a>
        <a href="bookings.html" class="active">◈ Bookings</a>
        <div class="admin-nav-label">Management</div>
        <a href="menu-management.html">◈ Menu</a>
        <a href="availability.html">◈ Availability</a>
      </nav>
      <div class="admin-sidebar-footer">
        Demo Provider Access<br />
        <a href="../index.html">← Back to Storefront</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:var(--s-3);">
          <button class="admin-toggle" id="sidebarToggle">☰</button>
          <div>
            <h1>Bookings</h1>
            <div class="admin-topbar-sub">Accept, prepare and complete incoming orders</div>
          </div>
        </div>
        <div class="admin-topbar-actions">
          <div class="admin-avatar">KP</div>
        </div>
      </header>

      <main class="admin-content">
        <!-- Filters -->
        <div class="filter-bar">
          <div class="filter-bar" id="statusChips" style="margin-bottom:0;"></div>
          <input type="text" class="search-input" id="bookingSearch" placeholder="Search by ID or customer…" />
        </div>

        <section class="panel reveal">
          <div class="panel-header">
            <h2>All Bookings</h2>
            <span class="text-muted" id="bookingCount" style="font-size:0.85rem;"></span>
          </div>
          <div class="panel-body no-pad">
            <div class="booking-table-wrap" id="bookingsTableWrap"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="detailTitle">Booking Details</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-sm" data-close-modal>Close</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Admin.initShell();
      Admin.renderBookings();
    });
  </script>
</body>
</html>
